<!DOCTYPE html>
<html>
  <head>
    <base target="_top">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">

    <style>
      body {
        font-family: 'Libre Baskerville', serif;
        font-size: 14px;
        padding-left: 5px;
        padding-right: 5px;
        padding-top: 5px;
      }
      button {
        display: block;
        width: 145px;
        height: 32px;
        //margin-top: 10px;
        font-family: 'Libre Baskerville', serif;
      }
      button.action {
        //padding: 10px 20px;
        font-size: 14px;
        border-radius: 8px;

  <body>
    <div id= "button-pics" style="display: flex; gap: 40px;">
      <div class = "encounters" style="display:inine-block; font-size: 0;">
        <button class="action" id ="forest" style="margin-left:5px; margin-bottom:2px;" onclick="showInfo('Enchanted Forest')">Enchanted Forest</button>
        <button class="action" style="margin-left:5px; margin-bottom:2px;" onclick="showInfo('Mountain Range')">Mountain Range</button>
        <button class="action" style="margin-left:5px; margin-bottom:2px;" onclick="showInfo('Misty Swamp')">Misty Swamp</button>
        <button class="action" style="margin-left:5px; margin-bottom:2px;" onclick="showInfo('Market Town')">Market Town</button>
        <button class="action" style="margin-left:5px; margin-bottom:2px;" onclick="showInfo('Make My Own')">Make My Own</button>
      </div>
      <img id="pic-box" />
    </div>

    <script>

    function showInfo(encounter) {
      let descriptionBox = document.getElementById("description-box");
      let picBox = document.getElementById("pic-box");
      let buttonPics = document.getElementById("button-pics");
      let nameBox = document.getElementById("name-box");
      let imgBox = document.getElementById("img-box");
      let clickDescription = false;
      let clickName = false;
      let clickImg = false;
      if (encounter === "Enchanted Forest") {
          descriptionBox.value = "A mystical woodland where the trees seem to whisper ancient secrets. The air is thick with magic, and strange, glowing flora light up the paths. A place of beauty and danger in equal measure.";
          picBox.src = "https://static.wixstatic.com/media/70fbf4_c1df13904ddd430589d8dd8e370ca6d9~mv2.jpeg/v1/fill/w_980,h_653,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/70fbf4_c1df13904ddd430589d8dd8e370ca6d9~mv2.jpeg";
          picBox.style="width: 200px; height: 180px;";
          buttonPics.style = "display: flex; gap: 30px;";
          nameBox.style.display = "none";
          nameBox.value = "Enchanted Forest";
          imgBox.style.display = "none";
          imgBox.value=picBox.src;
        } else if (encounter === "Mountain Range") {
          descriptionBox.value = "Towering peaks stretch across the horizon, their snow-covered summits piercing the sky. Rugged terrain and hidden valleys make this a land of extremes, where only the most resilient can thrive.";
          picBox.src = "https://uploads.worldanvil.com/uploads/images/49081822e6414785440d24dd845e8c69.jpeg";
          picBox.style="width: 200px; height: 180px;";
          buttonPics.style = "display: flex; gap: 30px;";
          nameBox.style.display = "none";
          nameBox.value = "Mountain Range";
          imgBox.style.display = "none";
          imgBox.value=picBox.src;
        } else if (encounter === "Misty Swamp") {
          descriptionBox.value = "A damp, eerie expanse where thick fog rolls over the murky waters. The ground squelches beneath your feet, and the distant croaks of unseen creatures echo through the trees. Danger lurks in every shadow.";
          picBox.src = "https://partybickering.wordpress.com/wp-content/uploads/2019/12/colrathisle.jpg";
          picBox.style="width: 200px; height: 180px;";
          buttonPics.style = "display: flex; gap: 30px;";
          nameBox.style.display = "none";
          nameBox.value = "Misty Swamp";
          imgBox.style.display = "none";
          imgBox.value=picBox.src;
        } else if (encounter === "Market Town") {
          descriptionBox.value = "A bustling hub of commerce, where merchants from all over the world trade goods in colorful stalls. The air is filled with the scent of fresh produce, exotic spices, and the sound of lively chatter and bargaining.";
          picBox.src = "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEh-yFHSD7fzzsBMnXzUhVrEsEfHHDaARhY44eNwJJvxE4pAB0gP37cYtvIoOCzhkNL6tXzMM4S33Vl3TtTE7fSsPxgIGVU4AiVGfcJZlM4f3x7_UHzdJFbpbcaTRotJ4JDAfLX9ZMxdzlQ/s1600/m2.jpg";
          picBox.style="width: 200px; height: 180px;";
          buttonPics.style = "display: flex; gap: 30px;";
          nameBox.style.display = "none";
          nameBox.value = "Market Town";
          imgBox.style.display = "none";
          imgBox.value=picBox.src;
        } else if (encounter === "Make My Own") {
          descriptionBox.value = "Create your own environment!";
          nameBox.value = "Enter name here: ";
          picBox.src = "https://upload.wikimedia.org/wikipedia/commons/5/5a/Black_question_mark.png";
          picBox.style= "width: 120px; height: 180px;";
          buttonPics.style = "display: flex; gap: 70px;";
          descriptionBox.readOnly=false;
          nameBox.readOnly=false;
          descriptionBox.onclick = function(){
            if (clickDescription == false){
              this.value = "";
              clickDescription = true;
            }
          };
          nameBox.onclick = function(){
            if (clickName == false){
              this.value = "";
              clickName = true;
            }
          };
          nameBox.style.display = '';
          imgBox.onclick = function(){
            if (clickImg == false){
              this.value = "";
              clickImg = true;
            }
          };
          imgBox.style.display = '';
          imgBox.value="Enter image url here (x.jpg, x.png, etc): ";
        }
    }

    function saveEnvironment() {
      const name = document.getElementById("name-box").value;
      const description = document.getElementById("description-box").value;
      const picSrc = document.getElementById("img-box").value;

      google.script.run.insertEnvironmentToDoc(name, description, picSrc);
    }
    window.onload = function() {
      showInfo('Enchanted Forest');
      let forestButton = document.getElementById("forest");
      forestButton.focus(); //to get orc button to be clicked automatically when page opens
      
    };
    </script>

    <div style="display: flex; gap: 30px;">
      <div style="display: flex; flex-direction: column; gap: 5px;">
        <div class = info style="display: flex; flex-direction: column">
          <textarea id="description-box" style="width: 100%; height: 200px; margin-top: 20px; text-align:left; font-size:16px; font-style:italic; resize: none;"></textarea>
          <textarea type="hidden" id="name-box" style="width: 95%; height: 35px; margin-top: 5px; text-align:left; font-size:17px; font-style:italic; resize: none; display:none;""></textarea>
          <textarea type="hidden" id="img-box" style="width: 95%; height: 70px; margin-top: 5px; text-align:left; font-size:17px; font-style:italic; resize: none; display:none;""></textarea>
        </div>
      </div>
      <div class="submit-button" style="display: flex; justify-content:left; margin-top: 25px;">
        <button class="action" type="submit" onClick="saveEnvironment()">Submit</button>
      </div>
    </div>
  </body>
</html>
